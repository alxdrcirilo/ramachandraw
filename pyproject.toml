[project]
name = "ramachandraw"
dynamic = ["version"]
description = "Ramachandran plotting tool"
authors = [{name = "Alexandre Cirilo", email = "38657258+alxdrcirilo@users.noreply.github.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.87",
    "matplotlib>=3.8.3",
    "pillow>=12.1.1",
]

[dependency-groups]
dev = [
    "mypy>=1.8.0",
    "pyclean>=2.7.6",
    "pytest>=8.0.1,<10.0.0",
    "pytest-coverage>=0.0",
    "ruff>=0.2.2",
    "scipy>=1.12.0"
]

[project.urls]
Repository = "https://github.com/alxdrcirilo/ramachandraw"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "B",   # bugbear
  "E",   # pycodestyle errors
  "F",   # Pyflakes
  "W",   # pycodestyle warnings
  "C90", # McCabe
  "C4",  # comprehensions
  "I",   # isort
  "UP",  # pyupgrade
]

[tool.hatch.build.targets.sdist]
include = [
    "ramachandraw",
]

[tool.hatch.build.targets.wheel]
include = [
    "ramachandraw",
]

[tool.hatch.build.targets.wheel.sources]
"ramachandraw" = "ramachandraw"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv-dynamic-versioning]
pattern = "default-unprefixed"
fallback-version = "0.0.0"

[tool.semantic_release]
tag_format = "{version}"
version_toml = []
commit_parser = "angular"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "uv-dynamic-versioning"]
