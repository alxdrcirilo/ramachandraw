name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UV_DYNAMIC_VERSIONING_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install python-semantic-release
        run: pip install python-semantic-release

      - name: Create release tag
        run: semantic-release version --no-changelog --no-vcs-release
        env:
          GH_TOKEN: ${{ secrets.UV_DYNAMIC_VERSIONING_TOKEN }}
